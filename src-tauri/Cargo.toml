[package]
name = "relay-fs"
version = "0.1.1"
description = "RelayFS — offline-first CRDT file collaboration"
authors = []
edition = "2021"

[lib]
name = "relay_fs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
ignore = "0.4"

[profile.release]
opt-level = 1
lto = false
codegen-units = 4
strip = true
