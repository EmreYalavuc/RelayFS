<svg viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Arka plan karanlık lüks degrade -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>

    <!-- Raycast tarzı üst kenar 1px parlak çizgi gradyanı -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- CRDT Eşitlenme / Sinyal Zümrüt Degradesi -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- P2P Veri Yolu Degradesi -->
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>

    <!-- Subtle Glow Filtresi -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan Squircle (Masaüstü İkon Kabuğu) -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- İç İnce Izgara Deseni (Mühendislik / Tooling Vurgusu) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" stroke-dasharray="4 6" />
  <circle cx="256" cy="256" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- CRDT / P2P Dinamik Yollar (Relay Akışları) -->
  <!-- Sol Eşten Çıkan Akış (Loop/Relay Eğrisi) -->
  <path d="M 148 200 C 148 290, 210 320, 256 320 C 302 320, 364 290, 364 200" fill="none" stroke="#27272a" stroke-width="14" stroke-linecap="round" />

  <!-- Sağ Eşten Çapraz Birleşme Yolu -->
  <path d="M 148 312 C 148 222, 210 192, 256 192 C 302 192, 364 222, 364 312" fill="none" stroke="#27272a" stroke-width="14" stroke-linecap="round" />

  <!-- Aktif Senkronizasyon Omurgası (Zümrüt Yeşil P2P Köprüsü) -->
  <path d="M 148 200 C 190 200, 220 312, 256 312 C 292 312, 322 200, 364 200" fill="none" stroke="url(#pathGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />

  <!-- Peer Düğümleri (A ve B Eşleri) -->
  <!-- Peer A (Sol Üst Terminal) -->
  <circle cx="148" cy="200" r="28" fill="#18181b" stroke="#3f3f46" stroke-width="6" />
  <circle cx="148" cy="200" r="12" fill="#e4e4e7" />

  <!-- Peer B (Sağ Üst Terminal) -->
  <circle cx="364" cy="200" r="28" fill="#18181b" stroke="#3f3f46" stroke-width="6" />
  <circle cx="364" cy="200" r="12" fill="#e4e4e7" />

  <!-- Merkez Convergence Çekirdeği (Deterministik Mutabakat Noktası) -->
  <circle cx="256" cy="312" r="32" fill="#042f2e" stroke="#10b981" stroke-width="4" filter="url(#glow)" />
  <circle cx="256" cy="312" r="14" fill="url(#emeraldGlow)" />

  <!-- Alt Metin: "RELAYFS" (Minimalist Mikro Monospace Tipografi) -->
  <text x="256" y="420" text-anchor="middle" fill="#71717a" font-family="ui-monospace, &#39;JetBrains Mono&#39;, &#39;Geist Mono&#39;, monospace" font-size="22" font-weight="700">RELAYFS</text>
</svg>