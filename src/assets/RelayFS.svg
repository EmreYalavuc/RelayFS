<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" fill="none">
  <defs>
    <!-- Forward arrow marker -->
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 1.5 L8.5 5 L0 8.5 Z" fill="#3B82F6"/>
    </marker>
    <!-- Return arrow marker (dimmer) -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 1.5 L8.5 5 L0 8.5 Z" fill="#3B82F6" opacity="0.4"/>
    </marker>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ─── MARK (72×72 square canvas) ─────────────────────────────────── -->

  <!-- Left FS node -->
  <rect x="6" y="18" width="24" height="32" rx="5"
        fill="#111113" stroke="#3B82F6" stroke-width="1.8"/>
  <!-- file content lines -->
  <line x1="12" y1="27" x2="24" y2="27" stroke="#3B82F6" stroke-width="1.4"
        stroke-linecap="round"/>
  <line x1="12" y1="33" x2="24" y2="33" stroke="#3B82F6" stroke-width="1.4"
        stroke-linecap="round"/>
  <line x1="12" y1="39" x2="20" y2="39" stroke="#3B82F6" stroke-width="1.4"
        stroke-linecap="round" opacity="0.45"/>

  <!-- Right FS node (offset slightly lower — different device) -->
  <rect x="42" y="26" width="24" height="32" rx="5"
        fill="#111113" stroke="#3B82F6" stroke-width="1.8"/>
  <!-- file content lines -->
  <line x1="48" y1="35" x2="60" y2="35" stroke="#3B82F6" stroke-width="1.4"
        stroke-linecap="round"/>
  <line x1="48" y1="41" x2="60" y2="41" stroke="#3B82F6" stroke-width="1.4"
        stroke-linecap="round"/>
  <line x1="48" y1="47" x2="56" y2="47" stroke="#3B82F6" stroke-width="1.4"
        stroke-linecap="round" opacity="0.45"/>

  <!-- Relay center dot -->
  <circle cx="36" cy="36" r="4.5" fill="#3B82F6" filter="url(#glow)"/>
  <circle cx="36" cy="36" r="8" stroke="#3B82F6" stroke-width="1"
          opacity="0.2"/>

  <!-- Forward path: left node → relay dot → right node -->
  <path d="M30 26 Q36 14 42 32"
        stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"
        marker-end="url(#af)" filter="url(#glow)"/>

  <!-- Return path: right node → relay dot → left node (dimmer, dashed) -->
  <path d="M42 44 Q36 58 30 46"
        stroke="#3B82F6" stroke-width="1.4" stroke-linecap="round"
        stroke-dasharray="3 2.5" opacity="0.38"
        marker-end="url(#ar)"/>

  <!-- ─── WORDMARK ────────────────────────────────────────────────────── -->

  <!-- Separator line -->
  <line x1="84" y1="16" x2="84" y2="56" stroke="#ffffff" stroke-width="1"
        opacity="0.07"/>

  <text x="96" y="47"
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif"
        font-weight="700" font-size="32" letter-spacing="-0.5"
        fill="#F1F5F9">Relay</text>

  <text x="218" y="47"
        font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace"
        font-weight="600" font-size="32" letter-spacing="3"
        fill="#3B82F6">FS</text>
</svg>
